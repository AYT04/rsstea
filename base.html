<!DOCTYPE html>
<html lang="en">
<head>
    <title>rssTea - YouTube Style RSS & Podcast Reader</title>
    <meta name="description" content="rssTea is a fast, lightweight RSS and podcast Web Viewer in YouTube style interface."/>
    <link rel="shortcut icon" href="favicon.ico"> 
    <link rel="icon" href="favicon.png">
    <link rel="manifest" href="manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="rssTea" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <meta charset="utf-8">
    <link rel="stylesheet" href="theme.css" type="text/css">
</head>
<body>

<header id="yt-header">
    <div class="header-left">
        <button class="icon-btn menu-btn" aria-label="Menu">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        <a href="#" class="yt-logo">
            <svg class="yt-icon" viewBox="0 0 24 24" width="30" height="30"><path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/><path fill="#FFFFFF" d="M9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            <span class="logo-text">rssTea</span>
            <span class="logo-region">UI</span>
        </a>
    </div>
    <div class="header-center">
        <div class="search-box">
            <input type="text" id="yt-search-input" placeholder="Search feeds and podcasts...">
            <button class="search-btn" aria-label="Search">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
        </div>
    </div>
    <div class="header-right">
        <button class="icon-btn" aria-label="Create">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4zM14 13h-3v3H9v-3H6v-2h3V8h2v3h3v2z"/></svg>
        </button>
        <button class="icon-btn" aria-label="Notifications">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        </button>
        <div class="user-avatar">A</div>
    </div>
</header>

<div id="yt-app-container">
    <aside id="sidebar">
        <nav class="sidebar-nav">
            <a href="#" class="sidebar-item active">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Home</span>
            </a>
            <a href="#" class="sidebar-item">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M18.7 8.7H5.3V7h13.4v1.7zm-1.7-5H7v1.7h10V3.7zm3.3 8.3H3.7v8.3h16.6V12zm-8.3 6.7v-5l4.2 2.5-4.2 2.5z"/></svg>
                <span>Subscriptions</span>
            </a>
            <a href="#" class="sidebar-item">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg>
                <span>Library</span>
            </a>
        </nav>
    </aside>

    <main id="main-content">
        <div id="filter-chips">
            <span class="chip active tab">All</span>
            <span class="chip tab">Posts</span>
            <span class="chip tab">Podcasts</span>
            <div class="channel-select-wrapper">
                <select name="changechannel" class="channel-dropdown"><!-- options here --></select>
            </div>
        </div>

        <div id="wrap" class="video-grid">
            <!-- posts here -->
        </div>
    </main>
</div>

<div id="floating_player">
    <div class="player_meta">
        <div class="player-left">
            <button id="playpausebutton" title="Play / Pause">Play</button>
            <div class="nowplaying-info">
                <span id="title">Not Playing</span>
            </div>
        </div>
        <div class="player-right">
            <button id="plus30" title="Forward 30s">+30s</button>
            <button id="speed" title="Speed">1x</button>
        </div>
    </div>
    <div id="timeline_wrap">
        <ul id="chapters"></ul>
        <span id="current_time">00:00</span>
        <span id="timeline">
            <input type="range" id="seekbar" min="0" max="100" step="0.1">
        </span>
        <span id="duration">00:00</span>
    </div>
</div>

<script>
const tabs = document.querySelectorAll('.tab');
const select = document.querySelector('select[name="changechannel"]');
const searchInput = document.getElementById('yt-search-input');
let selectedChannel = 'All';

function filterPosts() {
    const posts = document.querySelectorAll('.post');
    const searchTerm = searchInput ? searchInput.value.toLowerCase().trim() : '';
    const activeTab = document.querySelector('.chip.tab.active');
    const filterType = activeTab ? activeTab.textContent.trim() : 'All';

    posts.forEach(post => {
        const audio = parseInt(post.getAttribute('data-audio') || '0');
        const channel = post.getAttribute('data-channel');
        const titleText = post.querySelector('.video-title') ? post.querySelector('.video-title').textContent.toLowerCase() : '';

        let matchTab = (filterType === 'All') || (filterType === 'Posts' && audio === 0) || (filterType === 'Podcasts' && audio === 1);
        let matchChannel = (selectedChannel === 'All') || (channel === selectedChannel);
        let matchSearch = (searchTerm === '') || titleText.includes(searchTerm) || (channel && channel.toLowerCase().includes(searchTerm));

        if (matchTab && matchChannel && matchSearch) {
            post.style.display = 'flex';
        } else {
            post.style.display = 'none';
        }
    });
}

if (select) {
    select.addEventListener('change', () => {
        selectedChannel = select.value;
        filterPosts();
        tabs.forEach(tab => tab.classList.remove('active'));
        select.classList.add('selected');
    });
}

tabs.forEach(tab => {
    tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        if (select) {
            select.value = 'All';
            selectedChannel = 'All';
            select.classList.remove('selected');
        }
        filterPosts();
    });
});

if (searchInput) {
    searchInput.addEventListener('input', filterPosts);
}

document.addEventListener('DOMContentLoaded', function () {
    const btns = document.querySelectorAll('.audio-play-btn, .audio button[data-aid]');
    let caudio = null;
    let ppBtn = null;
    const fpBtn = document.querySelector('#floating_player #playpausebutton');
    const tl = document.querySelector('#timeline');
    const fsb = document.querySelector('#seekbar');

    if (fpBtn) {
        fpBtn.addEventListener('click', function () {
            togglePP();
        });
    }

    function togglePP() {
        if (caudio && caudio.paused) {
            caudio.play();
        } else if (caudio) {
            caudio.pause();
        }
    }

    if (tl && fsb) {
        tl.addEventListener('input', function (e) {
            if (caudio && caudio.duration) {
                const seekPercentage = fsb.value;
                const seekTime = (seekPercentage / 100) * caudio.duration;
                caudio.currentTime = seekTime;
            }
        });
    }

    const speeds = [1, 1.2, 1.5, 1.75, 2];
    let currentSpeedIndex = 0;
    const speedBtn = document.getElementById('speed');
    if (speedBtn) {
        speedBtn.addEventListener('click', () => {
            currentSpeedIndex = (currentSpeedIndex + 1) % speeds.length;
            const speed = speeds[currentSpeedIndex];
            if (caudio) caudio.playbackRate = speed;
            speedBtn.innerText = speed + 'x';
            updatePositionState();
        });
    }

    const plus30Btn = document.getElementById('plus30');
    if (plus30Btn) {
        plus30Btn.addEventListener('click', () => {
            if (caudio) caudio.currentTime += 30;
        });
    }

    function updateAudioTime() {
        if (!caudio) return;
        const currentTime = caudio.currentTime;
        const formattedCurrentTime = formatTime(currentTime);
        const formattedDuration = formatTime(caudio.duration);

        document.getElementById('current_time').textContent = formattedCurrentTime;
        document.getElementById('duration').textContent = formattedDuration;
        const progress = (currentTime / caudio.duration) * 100;
        fsb.value = progress || 0;
    }

    function playTime() {
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
        if (fpBtn) fpBtn.classList.add('playing');
        if (ppBtn) ppBtn.classList.add('playing');
        updatePositionState();
    }

    function pauseTime() {
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
        if (fpBtn) fpBtn.classList.remove('playing');
        if (ppBtn) ppBtn.classList.remove('playing');
        updatePositionState();
    }

    function formatTime(time) {
        if (!time || isNaN(time)) return '00:00';
        const minutes = Math.floor(time / 60);
        const seconds = Math.floor(time % 60);
        return ('0' + minutes).slice(-2) + ':' + ('0' + seconds).slice(-2);
    }

    btns.forEach(function (btn) {
        btn.addEventListener('click', function (e) {
            e.preventDefault();
            const aid = this.getAttribute('data-aid');
            const audioElem = document.querySelector('audio[aid="' + aid + '"]');
            if (audioElem) changePlayback(audioElem);
        });
    });

    function changePlayback(audioElem) {
        const prevPPBtn = ppBtn;
        ppBtn = document.querySelector('[data-aid="' + audioElem.getAttribute('aid') + '"]');

        if (caudio && caudio !== audioElem) {
            caudio.pause();
            caudio.removeEventListener('timeupdate', updateAudioTime);
            caudio.removeEventListener('play', playTime);
            caudio.removeEventListener('pause', pauseTime);

            if (prevPPBtn) prevPPBtn.classList.remove('playing');
            if (fpBtn) fpBtn.classList.remove('playing');
            if (fsb) fsb.value = '0';

            if (audioElem.readyState >= 1) {
                startPlayback(audioElem);
            } else {
                audioElem.addEventListener('loadedmetadata', function () {
                    startPlayback(audioElem);
                });
            }
        } else if (caudio) {
            togglePP();
        } else {
            if (audioElem.readyState >= 1) {
                startPlayback(audioElem);
            } else {
                audioElem.addEventListener('loadedmetadata', function () {
                    startPlayback(audioElem);
                });
            }
        }
    }

    function updatePositionState() {
        if ('mediaSession' in navigator && caudio && caudio.duration) {
            navigator.mediaSession.setPositionState({
                duration: caudio.duration,
                playbackRate: caudio.playbackRate,
                position: caudio.currentTime,
            });
        }
    }

    function startPlayback(audioElem) {
        const fp = document.querySelector('#floating_player');
        const closestPost = audioElem.closest('.post');
        document.querySelectorAll('.post.nowplaying').forEach(e => e.classList.remove('nowplaying'));
        if (closestPost) closestPost.classList.add('nowplaying');

        const titleElem = closestPost ? closestPost.querySelector('.video-title') : null;
        const h2text = titleElem ? titleElem.textContent : 'Audio Track';
        document.getElementById('title').innerHTML = h2text;

        caudio = audioElem;
        caudio.addEventListener('timeupdate', updateAudioTime);
        caudio.addEventListener('play', playTime);
        caudio.addEventListener('pause', pauseTime);

        const audioDur = caudio.duration;
        const formattedDur = formatTime(audioDur);
        document.getElementById('duration').textContent = formattedDur;

        if (fp) {
            fp.style.display = 'block';
            setTimeout(function () {
                fp.classList.add("show");
            }, 10);
        }
        caudio.play();

        if (speedBtn) speedBtn.innerText = caudio.playbackRate + 'x';

        if ('mediaSession' in navigator && closestPost) {
            const imgElem = closestPost.querySelector('img');
            const channelElem = closestPost.querySelector('.channel-name');
            navigator.mediaSession.metadata = new MediaMetadata({
                title: h2text,
                artist: channelElem ? channelElem.textContent : 'rssTea',
                album: "rssTea",
                artwork: imgElem ? [{ src: imgElem.src }] : [],
            });

            const totalAids = document.querySelectorAll('[data-aid]').length;
            let currentAid = Math.floor(audioElem.getAttribute('aid'));
            let nextAid = (currentAid + 1) % totalAids;
            let prevAid = (currentAid - 1 + totalAids) % totalAids;

            navigator.mediaSession.setActionHandler("play", () => caudio.play());
            navigator.mediaSession.setActionHandler("pause", () => caudio.pause());
            navigator.mediaSession.setActionHandler('nexttrack', () => {
                const nextAudio = document.querySelector('[aid="' + nextAid + '"]');
                if (nextAudio) changePlayback(nextAudio);
            });
            navigator.mediaSession.setActionHandler('previoustrack', () => {
                const prevAudio = document.querySelector('[aid="' + prevAid + '"]');
                if (prevAudio) changePlayback(prevAudio);
            });
            navigator.mediaSession.setActionHandler('seekbackward', (details) => {
                caudio.currentTime = Math.max(0, caudio.currentTime - (details.seekOffset || 10));
                updatePositionState();
            });
            navigator.mediaSession.setActionHandler('seekforward', (details) => {
                caudio.currentTime = Math.min(caudio.duration, caudio.currentTime + (details.seekOffset || 10));
                updatePositionState();
            });
        }
    }
});
</script>
</body>
</html>
